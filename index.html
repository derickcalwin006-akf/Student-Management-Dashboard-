<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="College Student Management System - Administrator Login Portal">
  <title>Login | Student Management System</title>
  <!-- Stylesheets -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page-body">

  <div class="login-card">
    <div class="login-header">
      <div class="login-logo" aria-hidden="true">
        <i class="fa-solid fa-graduation-cap"></i>
      </div>
      <h1>Student Management System</h1>
      <p>College Administration Portal</p>
    </div>

    <form id="loginForm" novalidate>
      <div class="form-group" style="margin-bottom: 1.25rem;">
        <label for="username" class="form-label">
          <i class="fa-regular fa-user" style="color: var(--primary-600);"></i> Username
        </label>
        <input 
          type="text" 
          id="username" 
          name="username" 
          class="form-control" 
          placeholder="Enter admin username" 
          autocomplete="username"
          required
        >
      </div>

      <div class="form-group" style="margin-bottom: 1.5rem;">
        <label for="password" class="form-label">
          <i class="fa-solid fa-lock" style="color: var(--primary-600);"></i> Password
        </label>
        <div class="password-input-wrap">
          <input 
            type="password" 
            id="password" 
            name="password" 
            class="form-control" 
            placeholder="Enter password" 
            autocomplete="current-password"
            required
            style="padding-right: 2.8rem;"
          >
          <button 
            type="button" 
            id="togglePasswordBtn" 
            class="password-toggle-btn" 
            title="Show password"
            aria-label="Toggle password visibility"
          >
            <i id="toggleIcon" class="fa-solid fa-eye"></i>
          </button>
        </div>
        <div id="loginErrorMessage" class="form-error-feedback" style="margin-top: 0.5rem;">
          <i class="fa-solid fa-circle-exclamation"></i> Invalid username or password.
        </div>
      </div>

      <button type="submit" id="loginBtn" class="btn-header-action btn-primary" style="width: 100%; justify-content: center; padding: 0.85rem; font-size: 1rem;">
        <i class="fa-solid fa-arrow-right-to-bracket"></i> Login to Dashboard
      </button>
    </form>

    <!-- Demo Credentials Section -->
    <div class="demo-credentials-box">
      <div class="demo-credentials-header">
        <span class="demo-title">
          <i class="fa-solid fa-key"></i> Demo Credentials
        </span>
        <button type="button" id="btnAutofill" class="btn-autofill">
          <i class="fa-solid fa-wand-magic-sparkles"></i> Auto-fill
        </button>
      </div>
      <div class="demo-credentials-content">
        <div><strong>User:</strong> admin</div>
        <div><strong>Pass:</strong> admin123</div>
      </div>
    </div>

    <div style="text-align: center; margin-top: 1.75rem; font-size: 0.78rem; color: var(--slate-400);">
      &copy; 2024 College Academic Administration. All rights reserved.
    </div>
  </div>

  <div id="toastContainer" class="toast-container"></div>

  <!-- Scripts -->
  <script src="js/app.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
